<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="入力した文字をドットで描くインタラクション作品" />
  <title>Dot Text | Interaction Archive</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="./script.js" defer></script>
</head>
<body>
  <main class="workspace">
    <a class="back-link" href="../../">← Interaction Archive</a>

    <div class="preview">
      <canvas id="dot-canvas" role="img" aria-label="入力した文字のドット表示">
        入力した文字をドットで表示します。
      </canvas>
    </div>

    <div class="controls">
      <label class="control" for="dot-color">
        <span>color</span>
        <input id="dot-color" type="color" value="#222222" />
      </label>

      <label class="control" for="dot-size">
        <span>dot size</span>
        <input
          id="dot-size"
          type="range"
          min="1"
          max="8"
          step="0.5"
          value="2"
        />
      </label>

      <label class="control" for="dot-shape">
        <span>dot shape</span>
        <select id="dot-shape">
          <option value="circle">丸</option>
          <option value="square">四角</option>
        </select>
      </label>
    </div>

    <div class="text-control">
      <input
        id="text-input"
        type="text"
        placeholder="テキストを入力"
        aria-label="ドットで表示する文字"
        maxlength="40"
        autocomplete="off"
        spellcheck="false"
      />
    </div>
  </main>
</body>
</html>
