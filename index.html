<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <meta
    name="description"
    content="Lintaro Yamamoto Portfolio"
  />

  <title>Lintaro Yamamoto</title>

  <link rel="stylesheet" href="./assets/style.css" />
</head>

<body>

  <div class="page">

    <!-- Header -->
    <header class="site-header">

      <a class="logo" href="./">
        LINTARO YAMAMOTO
      </a>

      <nav class="nav">
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </nav>

    </header>


    <main>

      <!-- Hero -->
      <section class="hero">

        <h1>
          LINTARO YAMAMOTO
        </h1>

      </section>


      <!-- Work -->
      <section class="works" id="work">

        <div class="section-title">
          <h2>Work</h2>
        </div>


        <div class="work-grid">


          <!-- Work 01 -->
          <a
            class="work-item"
            href="./works/dot-text/"
          >

            <div class="thumbnail">

              <!--
              作品画像を入れる場合は
              下のコメントアウトを外してください

              <img
                src="./assets/water-cursor.jpg"
                alt="Water Cursor"
              >
              -->

            </div>

            <h3>
              dot-text
            </h3>

          </a>

          <!-- Work Template -->
          <a
            class="work-item"
            href=""
          >

            <div class="thumbnail">

              <!--
              作品画像を入れる場合は
              下のコメントアウトを外してください

              <img
                src="./assets/water-cursor.jpg"
                alt="Water Cursor"
              >
              -->

            </div>

            <h3>
              cooming soon
            </h3>

          </a>
      
          <!--
          作品を追加したい場合は
          このブロックをコピー

          <a
            class="work-item"
            href="./works/example/"
          >

            <div class="thumbnail"></div>

            <h3>
              Work name
            </h3>

          </a>
          -->

        </div>

      </section>


      <!-- About -->
      <section class="about" id="about">

        <div class="section-title">
          <h2>About</h2>
        </div>

        <div class="about-content">

          <p>
            Lintaro Yamamoto is a designer and engineer
            exploring interaction, technology and everyday experiences.
          </p>

        </div>

      </section>


      <!-- Contact -->
      <section class="contact" id="contact">

        <div class="section-title">
          <h2>Contact</h2>
        </div>

        <div class="contact-content">

          <a href="mailto:yourmail@example.com">
            Email
          </a>

          <a href="#">
            Instagram
          </a>

        </div>

      </section>

    </main>


    <footer>

      <span>
        © 2026 Lintaro Yamamoto
      </span>

    </footer>

  </div>

</body>
</html>
